name: Deploy Banco Patacon infrastructure

on:
  workflow_dispatch:
    inputs:
      action:
        description: Action to execute
        required: true
        type: choice
        options:
          - apply
          - destroy
      student_identity:
        description: Prefix used in AWS resource names
        required: true
        default: live
        type: string

permissions:
  contents: read

jobs:
  terraform:
    name: Terraform ${{ inputs.action }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: terraform/infra
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
      - name: Terraform fmt check
        run: terraform fmt -check
      - name: Terraform init
        run: terraform init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" -backend-config="key=m3-c5/${{ inputs.student_identity }}/infra.tfstate" -backend-config="region=us-east-1"
      - name: Terraform validate
        run: terraform validate
      - name: Terraform plan
        if: inputs.action == 'apply'
        run: terraform plan -input=false -out=tfplan -var="student_identity=${{ inputs.student_identity }}"
      - name: Terraform apply
        if: inputs.action == 'apply'
        run: terraform apply -input=false -auto-approve tfplan
      - name: Terraform outputs
        if: inputs.action == 'apply'
        run: terraform output
      - name: Terraform destroy
        if: inputs.action == 'destroy'
        run: terraform destroy -input=false -auto-approve -var="student_identity=${{ inputs.student_identity }}"
      - name: Remove local plan
        if: always()
        run: rm -f tfplan
    