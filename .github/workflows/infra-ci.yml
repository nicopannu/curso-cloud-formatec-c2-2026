name: Infra CI/CD - Banco Patacon LAB01

on:
  push:
    paths:
      - ".github/workflows/infra-ci.yml"
      - "infra/**"
      - "ansible/**"
      - "scripts/**"
      - "guias/**"
      - "README.md"
  pull_request:
    paths:
      - ".github/workflows/infra-ci.yml"
      - "infra/**"
      - "ansible/**"
      - "scripts/**"
      - "guias/**"
      - "README.md"
  workflow_dispatch:
    inputs:
      operation:
        description: "Operación Terraform"
        required: true
        type: choice
        options:
          - plan
          - apply
          - destroy

permissions:
  contents: read

concurrency:
  group: infra-lab01-${{ github.ref }}
  cancel-in-progress: false

env:
  TF_VERSION: "1.15.8"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  ANSIBLE_CONFIG: ansible/ansible.cfg

jobs:
  ci:
    name: CI sin credenciales
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform fmt
        working-directory: infra
        run: terraform fmt -check -recursive

      - name: Terraform init sin backend
        working-directory: infra
        run: terraform init -backend=false

      - name: Terraform validate
        working-directory: infra
        run: terraform validate

      - name: Instalar Ansible para syntax-check
        run: |
          python3 -m pip install --user ansible-core
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Instalar colecciones Ansible
        run: ansible-galaxy collection install -r ansible/requirements.yml

      - name: Ansible syntax-check
        run: ansible-playbook --syntax-check ansible/playbook.yml

  deploy:
    name: deploy ${{ inputs.operation }}
    needs: ci
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: lab
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      TF_VAR_student_identity: ${{ vars.STUDENT_IDENTITY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Verificar identidad AWS
        run: aws sts get-caller-identity

      - name: Terraform fmt
        working-directory: infra
        run: terraform fmt -check -recursive

      - name: Terraform init con backend S3
        working-directory: infra
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ vars.TF_STATE_KEY }}" \
            -backend-config="region=${{ vars.AWS_REGION || 'us-east-1' }}" \
            -backend-config="use_lockfile=true"

      - name: Terraform validate
        working-directory: infra
        run: terraform validate

      - name: Terraform plan
        if: inputs.operation == 'plan'
        working-directory: infra
        run: terraform plan

      - name: Terraform apply plan
        if: inputs.operation == 'apply'
        working-directory: infra
        run: terraform plan -out=tfplan

      - name: Terraform apply
        if: inputs.operation == 'apply'
        working-directory: infra
        run: terraform apply -auto-approve tfplan

      - name: Terraform destroy plan
        if: inputs.operation == 'destroy'
        working-directory: infra
        run: terraform plan -destroy -out=tfplan

      - name: Terraform destroy
        if: inputs.operation == 'destroy'
        working-directory: infra
        run: terraform apply -auto-approve tfplan

      - name: Instalar Session Manager Plugin
        if: inputs.operation == 'apply'
        run: |
          curl -fsSL "https://s3.amazonaws.com/session-manager-downloads/plugin/latest/ubuntu_64bit/session-manager-plugin.deb" -o /tmp/session-manager-plugin.deb
          sudo dpkg -i /tmp/session-manager-plugin.deb

      - name: Instalar Ansible
        if: inputs.operation == 'apply'
        run: |
          python3 -m pip install --user --upgrade ansible-core boto3 botocore
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Instalar colecciones Ansible
        if: inputs.operation == 'apply'
        run: ansible-galaxy collection install -r ansible/requirements.yml

      - name: Generar inventario desde outputs
        if: inputs.operation == 'apply'
        run: |
          terraform -chdir=infra output -json > tf-outputs.json
          python3 scripts/render_inventory.py tf-outputs.json ansible/inventory.generated.yml

      - name: Esperar registro de EC2 en Systems Manager
        if: inputs.operation == 'apply'
        run: |
          INSTANCE_ID="$(terraform -chdir=infra output -raw instance_id)"
          for attempt in {1..30}; do
            STATUS="$(aws ssm describe-instance-information \
              --filters "Key=InstanceIds,Values=${INSTANCE_ID}" \
              --query 'InstanceInformationList[0].PingStatus' \
              --output text 2>/dev/null || true)"
            if [ "$STATUS" = "Online" ]; then
              echo "$INSTANCE_ID está Online en Systems Manager"
              exit 0
            fi
            echo "Intento ${attempt}/30: esperando registro SSM"
            sleep 10
          done
          echo "La instancia no quedó Online en Systems Manager" >&2
          exit 1

      - name: Ejecutar Ansible por SSM
        if: inputs.operation == 'apply'
        run: ansible-playbook -i ansible/inventory.generated.yml ansible/playbook.yml

      - name: Comprobar HTTP público
        if: inputs.operation == 'apply'
        run: |
          PUBLIC_IP="$(terraform -chdir=infra output -raw public_ip)"
          curl --fail --retry 10 --retry-delay 12 --retry-connrefused "http://${PUBLIC_IP}/"
