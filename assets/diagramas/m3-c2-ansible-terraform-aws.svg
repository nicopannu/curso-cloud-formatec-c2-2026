<rect x="495" y="270" width="52" height="52" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
<path d="M508 286h26M508 296h18M508 306h22" stroke="#7c3aed" stroke-width="3" stroke-linecap="round"/>
