<text x="592" y="292" text-anchor="middle" class="text">Ubuntu 24.04</text>
<text x="592" y="321" text-anchor="middle" class="text">Ansible + inventario</text>
<text x="592" y="350" text-anchor="middle" class="text">Playbooks + templates</text>
