<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Arquitectura M3-C2: Terraform y Ansible en AWS</title>
<desc id="desc">Una notebook ejecuta Terraform y accede por SSH al control node. El control node usa Ansible por SSH privado para configurar web01 y web02. La notebook valida HTTP por IP pública.</desc>
<defs>
  <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker>
  <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/></marker>
  <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ea580c"/></marker>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.18"/></filter>
  <style>
    .title{font:700 28px Arial,sans-serif;fill:#0f172a}.subtitle{font:16px Arial,sans-serif;fill:#475569}.label{font:700 18px Arial,sans-serif;fill:#0f172a}.text{font:15px Arial,sans-serif;fill:#334155}.small{font:13px Arial,sans-serif;fill:#475569}.edge{font:700 14px Arial,sans-serif}.box{filter:url(#shadow)}
  </style>
</defs>
<rect width="1200" height="720" fill="#f8fafc"/>
<text x="600" y="42" text-anchor="middle" class="title">M3-C2 · Terraform aprovisiona, Ansible configura</text>
<text x="600" y="70" text-anchor="middle" class="subtitle">CloudCuyo: un control node administra dos servidores web por red privada</text>

<!-- Notebook -->
<g class="box">
  <rect x="45" y="235" width="250" height="190" rx="18" fill="#ffffff" stroke="#2563eb" stroke-width="3"/>
  <rect x="78" y="270" width="184" height="100" rx="7" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <rect x="63" y="380" width="214" height="12" rx="6" fill="#93c5fd"/>
</g>
<text x="170" y="220" text-anchor="middle" class="label">Notebook del alumno</text>
<text x="170" y="305" text-anchor="middle" class="text">WSL o PowerShell</text>
<text x="170" y="331" text-anchor="middle" class="text">Terraform · AWS CLI</text>
<text x="170" y="357" text-anchor="middle" class="text">SSH · SCP · HTTP</text>
<text x="170" y="415" text-anchor="middle" class="small">State y claves privadas locales</text>

