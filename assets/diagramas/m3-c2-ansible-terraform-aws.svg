<rect x="350" y="105" width="805" height="525" rx="24" fill="#fff7ed" stroke="#ea580c" stroke-width="3" stroke-dasharray="10 7"/>
<text x="380" y="137" class="label" fill="#9a3412">AWS · us-east-1</text>
