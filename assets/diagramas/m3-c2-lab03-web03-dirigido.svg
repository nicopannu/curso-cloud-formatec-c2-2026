<path d="M645 385 C700 420 730 480 775 525" fill="none" stroke="#16a34a" stroke-width="6" marker-end="url(#green)"/>
<rect x="646" y="438" width="152" height="28" rx="7" fill="#fff7ed"/>
<text x="722" y="458" text-anchor="middle" class="e" fill="#16a34a">sólo web03</text>

<rect x="375" y="535" width="335" height="60" rx="12" fill="#fff" stroke="#cbd5e1"/>
<text x="542" y="559" text-anchor="middle" class="s">Gris: nodos existentes sin cambios</text>
<text x="542" y="581" text-anchor="middle" class="s">Verde: nodo seleccionado y handler dirigido</text>
