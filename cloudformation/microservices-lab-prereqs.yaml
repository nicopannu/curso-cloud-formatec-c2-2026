AWSTemplateFormatVersion: '2010-09-09'
Description: CloudCuyo Microservices Lab - temporary ALB and EC2 instance profile for instructor validation

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Red existente
        Parameters:
          - VpcId
          - PublicSubnetAId
          - PublicSubnetBId
      - Label:
          default: Laboratorio
        Parameters:
          - ProjectName
          - Environment

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC del laboratorio.

  PublicSubnetAId:
    Type: AWS::EC2::Subnet::Id
    Description: Subnet publica existente en us-east-1a.

  PublicSubnetBId:
    Type: AWS::EC2::Subnet::Id
    Description: Subnet publica existente en us-east-1b.

  ProjectName:
    Type: String
    Default: cloudcuyo
    AllowedPattern: "^[a-z0-9-]+$"

  Environment:
    Type: String
    Default: microservices-lab
    AllowedPattern: "^[a-z0-9-]+$"

Resources:
  AlbSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub ${ProjectName}-alb-sg-${Environment}
      GroupDescription: SG ALB publico para lab de microservicios CloudCuyo
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: HTTP publico para el laboratorio
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-alb-sg-${Environment}
        - Key: Lab
          Value: m2-c3-microservices

  LabAlb:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub ${ProjectName}-ms-${Environment}
      Type: application
      Scheme: internet-facing
      IpAddressType: ipv4
      SecurityGroups:
        - !Ref AlbSg
      Subnets:
        - !Ref PublicSubnetAId
        - !Ref PublicSubnetBId
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-ms-alb-${Environment}
        - Key: Lab
          Value: m2-c3-microservices

  LabAlbListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LabAlb
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: fixed-response
          FixedResponseConfig:
            StatusCode: "404"
            ContentType: text/plain
            MessageBody: CloudCuyo lab route not configured

  LabEc2Role:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${ProjectName}-${Environment}-ec2-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
        - arn:aws:iam::aws:policy/CloudWatchAgentServerPolicy
      Tags:
        - Key: Lab
          Value: m2-c3-microservices

  LabEc2InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub ${ProjectName}-${Environment}-ec2-profile
      Roles:
        - !Ref LabEc2Role

Outputs:
  AlbDnsName:
    Description: DNS publico del ALB del laboratorio.
    Value: !GetAtt LabAlb.DNSName

  AlbArn:
    Value: !Ref LabAlb

  AlbSecurityGroupId:
    Value: !Ref AlbSg

  AlbListenerArn:
    Value: !Ref LabAlbListener

  SsmInstanceProfileName:
    Value: !Ref LabEc2InstanceProfile
