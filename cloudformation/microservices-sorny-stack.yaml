  # ── EC2: PURCHASE ─────────────────────────────────────────────────────────────
  PurchaseNode:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref SsmInstanceProfileName
      NetworkInterfaces:
        - DeviceIndex: 0
          AssociatePublicIpAddress: true
          SubnetId: !Ref SubnetAId
          GroupSet: [!Ref PurchaseSg]
      UserData:
        Fn::Base64:
          Fn::Sub:
            - |
              #!/bin/bash
              set -euo pipefail
              exec > >(tee /var/log/user-data.log) 2>&1
              dnf update -y && dnf install -y python3 python3-pip amazon-cloudwatch-agent
              pip3 install flask requests gunicorn
              mkdir -p /opt/sorni/purchase /var/log/sorni
              cat > /opt/sorni/purchase/app.py << 'PYAPP'
              import os, uuid, requests
              from flask import Flask, jsonify, request
              app = Flask(__name__)
              PU=os.getenv("PAYMENT_SERVICE_URL","http://127.0.0.1:5004/api/payments")
              PRODUCTS={"sorni-luma-32":{"sku":"sorni-luma-32","name":"Sorny Luma 32","price":189999},"sorni-braviax-43":{"sku":"sorni-braviax-43","name":"Sorny Braviax 43","price":319999},"sorni-croma-50":{"sku":"sorni-croma-50","name":"Sorny Croma 50","price":489999},"sorni-trinitronix-55":{"sku":"sorni-trinitronix-55","name":"Sorny Trinitronix 55","price":629999},"sorni-cinepro-65":{"sku":"sorni-cinepro-65","name":"Sorny CinePro 65","price":899999},"sorni-mega-75":{"sku":"sorni-mega-75","name":"Sorny Mega 75","price":1299999}}
              PUR={}
              @app.get("/api/purchases/health")
              def h(): return jsonify({"service":"purchase-service","status":"ok","payment_service_url":PU})
              @app.post("/api/purchases")
              def create():
                  p=request.get_json(silent=True) or {}; sk=p.get("sku"); cs=p.get("customer","cliente@sorny.local")
                  if not sk: return jsonify({"error":"missing_sku"}),400
                  product=PRODUCTS.get(sk)
                  if not product: return jsonify({"error":"unknown_sku"}),404
                  app.logger.info("purchase sku=%s customer=%s",sk,cs)
                  pid="pur-"+uuid.uuid4().hex[:8]
                  try: pr=requests.post(PU.rstrip("/")+"/checkout",json={"purchase_id":pid,"sku":sk,"amount":product["price"]},timeout=2)
                  except Exception as e: app.logger.exception("payment fail pid=%s url=%s",pid,PU); return jsonify({"error":"payment_service_unavailable","detail":str(e)}),503
                  if pr.status_code!=200: return jsonify({"error":"payment_rejected","detail":pr.json()}),pr.status_code
                  pd=pr.json(); pu={"purchase_id":pid,"sku":sk,"status":"payment_pending","payment_url":pd["payment_url"],"backend":"purchase-service"}
                  PUR[pid]=pu; app.logger.info("purchase created pid=%s sku=%s",pid,sk); return jsonify(pu)
              @app.get("/api/purchases/<pid>")
              def get(pid):
                  pu=PUR.get(pid)
                  if not pu: return jsonify({"error":"not_found"}),404
                  return jsonify(pu)
              PYAPP
              cat > /opt/aws/amazon-cloudwatch-agent/etc/amazon-cloudwatch-agent.json << 'CWCONFIG'
              {"logs":{"logs_collected":{"files":{"collect_list":[
                {"file_path":"/var/log/sorni/purchase.log","log_group_name":"/${ProjectName}/${Environment}/site","log_stream_name":"purchase-service"}
              ]}}}}
              CWCONFIG
              cat > /etc/systemd/system/sorni-purchase.service << SRV
              [Unit]
              Description=Sorny purchase
              After=network-online.target
              Wants=network-online.target

              [Service]
              WorkingDirectory=/opt/sorni/purchase
              Environment=PAYMENT_SERVICE_URL=${PaymentUrl}
              ExecStart=/usr/local/bin/gunicorn --bind 0.0.0.0:5002 --workers 2 app:app
              Restart=always
              RestartSec=3
              StandardOutput=append:/var/log/sorni/purchase.log
              StandardError=append:/var/log/sorni/purchase.log

              [Install]
              WantedBy=multi-user.target
              SRV
              systemctl daemon-reload && systemctl enable sorni-purchase && systemctl start sorni-purchase
              /opt/aws/amazon-cloudwatch-agent/bin/amazon-cloudwatch-agent-ctl -a fetch-config -m ec2 -c file:/opt/aws/amazon-cloudwatch-agent/etc/amazon-cloudwatch-agent.json -s
            - PaymentUrl: !If
                - ShouldDeployComplete
                - !Sub "http://${LabAlb.DNSName}/api/payments"
                - !Ref PurchasePaymentServiceUrl
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-purchase-${Environment}
        - Key: Lab
          Value: m2-c3-sorny-microservices

  # ── EC2: PAYMENT ──────────────────────────────────────────────────────────────
  PaymentNode:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref SsmInstanceProfileName
      NetworkInterfaces:
        - DeviceIndex: 0
          AssociatePublicIpAddress: true
          SubnetId: !Ref SubnetAId
          GroupSet: [!Ref PaymentSg]
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euo pipefail
          exec > >(tee /var/log/user-data.log) 2>&1
          dnf update -y && dnf install -y python3 python3-pip amazon-cloudwatch-agent
          pip3 install flask gunicorn
          mkdir -p /opt/sorni/payment /var/log/sorni
          cat > /opt/sorni/payment/app.py << 'PYAPP'
          from flask import Flask, jsonify, request
          app = Flask(__name__)
          @app.get("/api/payments/health")
          def h(): return jsonify({"service":"payment-service","status":"ok"})
          @app.post("/api/payments/checkout")
          def checkout():
              p=request.get_json(silent=True) or {}; pid=p.get("purchase_id"); am=p.get("amount")
              if not pid or am is None: return jsonify({"error":"missing_purchase_or_amount"}),400
              purl="/checkout?pid="+pid+"&amount="+str(am)
              app.logger.info("payment link pid=%s amt=%s",pid,am)
              return jsonify({"backend":"payment-service","purchase_id":pid,"payment_url":purl,"status":"payment_link_created"})
          PYAPP
          cat > /opt/aws/amazon-cloudwatch-agent/etc/amazon-cloudwatch-agent.json << 'CWCONFIG'
          {"logs":{"logs_collected":{"files":{"collect_list":[
            {"file_path":"/var/log/sorni/payment.log","log_group_name":"/${ProjectName}/${Environment}/site","log_stream_name":"payment-service"}
          ]}}}}
          CWCONFIG
          cat > /etc/systemd/system/sorni-payment.service << 'SRV'
          [Unit]
          Description=Sorny payment
          After=network-online.target
          Wants=network-online.target

          [Service]
          WorkingDirectory=/opt/sorni/payment
          ExecStart=/usr/local/bin/gunicorn --bind 0.0.0.0:5004 --workers 2 app:app
          Restart=always
          RestartSec=3
          StandardOutput=append:/var/log/sorni/payment.log
          StandardError=append:/var/log/sorni/payment.log

          [Install]
          WantedBy=multi-user.target
          SRV
          systemctl daemon-reload && systemctl enable sorni-payment && systemctl start sorni-payment
          /opt/aws/amazon-cloudwatch-agent/bin/amazon-cloudwatch-agent-ctl -a fetch-config -m ec2 -c file:/opt/aws/amazon-cloudwatch-agent/etc/amazon-cloudwatch-agent.json -s
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-payment-${Environment}
        - Key: Lab
          Value: m2-c3-sorny-microservices

  # ── Target Groups ─────────────────────────────────────────────────────────────
  FrontendTg:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref VpcId
      Protocol: HTTP
      Port: 5000
      TargetType: instance
      HealthCheckPath: /health
      Matcher:
        HttpCode: 200
      Targets:
        - Id: !Ref FrontendNode
          Port: 5000

  MonolithTg:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref VpcId
      Protocol: HTTP
      Port: 5001
      TargetType: instance
      HealthCheckPath: /api/health
      Matcher:
        HttpCode: 200
      Targets:
        - Id: !Ref MonolithNode
          Port: 5001

  DeliveryTg:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref VpcId
      Protocol: HTTP
      Port: 5005
      TargetType: instance
      HealthCheckPath: /api/delivery/health
      Matcher:
        HttpCode: 200
      Targets:
        - Id: !Ref DeliveryNode
          Port: 5005

  PurchaseTg:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref VpcId
      Protocol: HTTP
      Port: 5002
      TargetType: instance
      HealthCheckPath: /api/purchases/health
      Matcher:
        HttpCode: 200
      Targets:
        - Id: !Ref PurchaseNode
          Port: 5002

  PaymentTg:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref VpcId
      Protocol: HTTP
      Port: 5004
      TargetType: instance
      HealthCheckPath: /api/payments/health
      Matcher:
        HttpCode: 200
      Targets:
        - Id: !Ref PaymentNode
          Port: 5004

  # ── ALB Rules ─────────────────────────────────────────────────────────────────
  ApiToMonolithRule:
    Condition: ShouldCreateBaseRules
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref LabAlbListener
      Priority: 100
      Conditions:
        - Field: path-pattern
          Values: [/api/*]
      Actions:
        - Type: forward
          TargetGroupArn: !Ref MonolithTg

  FrontendRule:
    Condition: ShouldCreateBaseRules
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref LabAlbListener
      Priority: 200
      Conditions:
        - Field: path-pattern
          Values: [/*]
      Actions:
        - Type: forward
          TargetGroupArn: !Ref FrontendTg

  PurchaseRule:
    Condition: ShouldCreateMicroserviceRules
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref LabAlbListener
      Priority: 10
      Conditions:
        - Field: path-pattern
          Values: [/api/purchases, /api/purchases/*]
      Actions:
        - Type: forward
          TargetGroupArn: !Ref PurchaseTg

  DeliveryRule:
    Condition: ShouldCreateMicroserviceRules
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref LabAlbListener
      Priority: 20
      Conditions:
        - Field: path-pattern
          Values: [/api/delivery, /api/delivery/*]
      Actions:
        - Type: forward
          TargetGroupArn: !Ref DeliveryTg

  PaymentRule:
    Condition: ShouldCreateMicroserviceRules
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref LabAlbListener
      Priority: 30
      Conditions:
        - Field: path-pattern
          Values: [/api/payments, /api/payments/*]
      Actions:
        - Type: forward
          TargetGroupArn: !Ref PaymentTg

  # ── CloudWatch Alarms ─────────────────────────────────────────────────────────
  FrontendNodeStatusAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${ProjectName}-${Environment}-frontend-status-check
      Namespace: AWS/EC2
      MetricName: StatusCheckFailed
      Dimensions:
        - Name: InstanceId
          Value: !Ref FrontendNode
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 2
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  MonolithNodeStatusAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${ProjectName}-${Environment}-monolith-status-check
      Namespace: AWS/EC2
      MetricName: StatusCheckFailed
      Dimensions:
        - Name: InstanceId
          Value: !Ref MonolithNode
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 2
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  DeliveryNodeStatusAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${ProjectName}-${Environment}-delivery-status-check
      Namespace: AWS/EC2
      MetricName: StatusCheckFailed
      Dimensions:
        - Name: InstanceId
          Value: !Ref DeliveryNode
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 2
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  PurchaseNodeStatusAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${ProjectName}-${Environment}-purchase-status-check
      Namespace: AWS/EC2
      MetricName: StatusCheckFailed
      Dimensions:
        - Name: InstanceId
          Value: !Ref PurchaseNode
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 2
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  PaymentNodeStatusAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${ProjectName}-${Environment}-payment-status-check
      Namespace: AWS/EC2
      MetricName: StatusCheckFailed
      Dimensions:
        - Name: InstanceId
          Value: !Ref PaymentNode
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 2
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

