AWSTemplateFormatVersion: '2010-09-09'
Description: "Sorny commerce microservices - 5 EC2s: frontend, monolith, delivery, purchase, payment. DeployComplete=true despliega todo listo para demo."

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Red
        Parameters:
          - VpcId
          - SubnetAId
          - SubnetBId
      - Label:
          default: EC2
        Parameters:
          - InstanceType
          - SsmInstanceProfileName
          - LatestAmiId
      - Label:
          default: Aplicacion
        Parameters:
          - ProjectName
          - Environment
          - PurchasePaymentServiceUrl
          - CreateBaseAlbRules
          - CreateMicroserviceAlbRules
      - Label:
          default: Modo de despliegue
        Parameters:
          - DeployComplete

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC del laboratorio

  SubnetAId:
    Type: AWS::EC2::Subnet::Id
    Description: Subnet publica para EC2s (us-east-1a)

  SubnetBId:
    Type: AWS::EC2::Subnet::Id
    Description: Segunda subnet publica para ALB (us-east-1b)

  InstanceType:
    Type: String
    Default: t3.micro
    AllowedValues: [t3.micro, t3.small]
    Description: Tipo de instancia

  SsmInstanceProfileName:
    Type: String
    Description: Instance Profile existente con SSM y CloudWatch permisos

  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64

  ProjectName:
    Type: String
    Default: sorny
    AllowedPattern: "^[a-z0-9-]+$"

  Environment:
    Type: String
    Default: microservices-site
    AllowedPattern: "^[a-z0-9-]+$"

  PurchasePaymentServiceUrl:
    Type: String
    Default: http://REPLACE-WITH-ALB-DNS/api/payments
    Description: "URL del payment-service. Reemplazar REPLACE-WITH-ALB-DNS con el DNS del ALB (output AlbDnsName) despues del deploy."

  CreateBaseAlbRules:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]

  CreateMicroserviceAlbRules:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]

  DeployComplete:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: "true = crea todas las reglas del ALB y configura PAYMENT_SERVICE_URL con el DNS del ALB automaticamente. Util para demo o para saltear al ejercicio de diagnostico."

Conditions:
  ShouldDeployComplete: !Equals [!Ref DeployComplete, "true"]
  ShouldCreateBaseRules: !Or
    - !Equals [!Ref CreateBaseAlbRules, "true"]
    - !Condition ShouldDeployComplete
  ShouldCreateMicroserviceRules: !Or
    - !Equals [!Ref CreateMicroserviceAlbRules, "true"]
    - !Condition ShouldDeployComplete

Resources:
  # ── ALB ──────────────────────────────────────────────────────────────────────
  AlbSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub ${ProjectName}-alb-sg-${Environment}
      GroupDescription: SG ALB Sorny - HTTP publico
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: HTTP publico
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-alb-sg-${Environment}
        - Key: Lab
          Value: m2-c3-sorny-microservices

  LabAlb:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub ${ProjectName}-ms-${Environment}
      Type: application
      Scheme: internet-facing
      IpAddressType: ipv4
      SecurityGroups: [!Ref AlbSg]
      Subnets: [!Ref SubnetAId, !Ref SubnetBId]
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-ms-alb-${Environment}
        - Key: Lab
          Value: m2-c3-sorny-microservices

  LabAlbListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LabAlb
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: fixed-response
          FixedResponseConfig:
            StatusCode: "404"
            ContentType: text/plain
            MessageBody: Sorny route not configured

  # ── Logs ─────────────────────────────────────────────────────────────────────
  SiteLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /${ProjectName}/${Environment}/site
      RetentionInDays: 7

  # ── Security Groups ───────────────────────────────────────────────────────────
  FrontendSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub ${ProjectName}-frontend-sg-${Environment}
      GroupDescription: SG frontend Sorny - trafico desde ALB
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5000
          ToPort: 5000
          SourceSecurityGroupId: !Ref AlbSg
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-frontend-sg-${Environment}
        - Key: Lab
          Value: m2-c3-sorny-microservices

  MonolithSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub ${ProjectName}-monolith-sg-${Environment}
      GroupDescription: SG monolith Sorny - trafico desde ALB
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5001
          ToPort: 5001
          SourceSecurityGroupId: !Ref AlbSg
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-monolith-sg-${Environment}
        - Key: Lab
          Value: m2-c3-sorny-microservices

  DeliverySg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub ${ProjectName}-delivery-sg-${Environment}
      GroupDescription: SG delivery Sorny - trafico desde ALB
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5005
          ToPort: 5005
          SourceSecurityGroupId: !Ref AlbSg
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-delivery-sg-${Environment}
        - Key: Lab
          Value: m2-c3-sorny-microservices

  PurchaseSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub ${ProjectName}-purchase-sg-${Environment}
      GroupDescription: SG purchase Sorny - trafico desde ALB
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5002
          ToPort: 5002
          SourceSecurityGroupId: !Ref AlbSg
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-purchase-sg-${Environment}
        - Key: Lab
          Value: m2-c3-sorny-microservices

  PaymentSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub ${ProjectName}-payment-sg-${Environment}
      GroupDescription: SG payment Sorny - trafico desde ALB
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5004
          ToPort: 5004
          SourceSecurityGroupId: !Ref AlbSg
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-payment-sg-${Environment}
        - Key: Lab
          Value: m2-c3-sorny-microservices

  # ── EC2: FRONTEND ─────────────────────────────────────────────────────────────
  FrontendNode:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref SsmInstanceProfileName
      NetworkInterfaces:
        - DeviceIndex: 0
          AssociatePublicIpAddress: true
          SubnetId: !Ref SubnetAId
          GroupSet: [!Ref FrontendSg]
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euo pipefail
          exec > >(tee /var/log/user-data.log) 2>&1
          dnf update -y && dnf install -y python3 python3-pip amazon-cloudwatch-agent
          pip3 install flask gunicorn
          mkdir -p /opt/sorni/frontend /var/log/sorni
          cat > /opt/sorni/frontend/app.py << 'PYAPP'
          from flask import Flask, Response, request
          app = Flask(__name__)
          @app.get("/")
          def index():
              return Response("""<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sorny Argentina</title><style>
              *{box-sizing:border-box;margin:0}body{background:#f4f6fa;color:#1a1f2b;font-family:Inter,system-ui,Segoe UI,Arial,sans-serif}
              .w{max-width:1180px;margin:auto;padding:0 20px}
              header{background:#fff;border-bottom:1px solid #e4e9f0;position:sticky;top:0;z-index:10}
              .hdr{height:68px;display:flex;align-items:center;justify-content:space-between}
              .logo{display:flex;align-items:center;gap:10px}
              .logo svg{width:90px;height:28px}
              .nav{display:flex;gap:28px;font-size:14px;color:#4a5568}
              .hero{background:linear-gradient(135deg,#0f172a 0%,#1e3a5f 100%);color:#fff;padding:56px 20px 48px;text-align:center}
              .hero h1{font-size:clamp(32px,5vw,52px);font-weight:600;letter-spacing:-.02em;margin-bottom:12px}
              .hero p{font-size:18px;color:#b0c4de;max-width:600px;margin:0 auto 24px;line-height:1.6}
              .btn{display:inline-block;border:0;border-radius:6px;padding:12px 28px;font-weight:600;cursor:pointer;text-decoration:none;font-size:15px}
              .btn-p{background:#2563eb;color:#fff}
              .btn-p:hover{background:#1d4ed8}
              .sec{padding:32px 20px}
              .sec h2{font-size:28px;font-weight:600;margin-bottom:6px}
              .sec p{color:#64748b}
              .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px;padding:20px 0}
              .card{background:#fff;border:1px solid #e2e8f0;border-radius:10px;overflow:hidden;transition:box-shadow .2s}
              .card:hover{box-shadow:0 8px 25px rgba(0,0,0,.08)}
              .tvvis{height:200px;display:grid;place-items:center;position:relative;background:#f8fafc}
              .tvvis .sz{position:absolute;top:14px;left:14px;font-size:12px;color:#94a3b8;font-weight:600}
              .tvs{width:80%;max-width:260px;aspect-ratio:16/9;border:6px solid #1e293b;border-radius:4px;position:relative;box-shadow:0 12px 24px rgba(0,0,0,.12)}
              .tvs:after{content:"";position:absolute;left:38%;right:38%;bottom:-18px;height:14px;background:#334155;border-radius:0 0 4px 4px}
              .t1{background:linear-gradient(135deg,#1e3a5f,#60a5fa 55%,#eff6ff)}
              .t2{background:linear-gradient(135deg,#1e293b,#94a3b8 50%,#f8fafc)}
              .t3{background:linear-gradient(135deg,#312e81,#a78bfa 50%,#ede9fe)}
              .t4{background:linear-gradient(135deg,#065f46,#34d399 50%,#d1fae5)}
              .t5{background:linear-gradient(135deg,#7f1d1d,#f87171 50%,#fee2e2)}
              .t6{background:linear-gradient(135deg,#292524,#a8a29e 50%,#fafaf9)}
              .body{padding:18px;display:grid;gap:8px}
              .sk{font-size:11px;color:#94a3b8;text-transform:uppercase;letter-spacing:.05em}
              .body h3{font-size:17px;font-weight:600}
              .desc{font-size:13px;color:#64748b;line-height:1.4}
              .prc{font-size:24px;font-weight:700;color:#0f172a;padding:4px 0}
              .card .btn-p{width:100%;text-align:center;display:block;padding:11px;font-size:14px}
              .overlay{display:none;position:fixed;inset:0;background:rgba(15,23,42,.7);z-index:100;align-items:center;justify-content:center;padding:20px}
              .overlay.s{display:flex}
              .modal{background:#fff;border-radius:14px;padding:36px;max-width:520px;width:100%;max-height:90vh;overflow-y:auto}
              .modal h2{font-size:24px;margin-bottom:16px}
              .modal .prc{font-size:28px;margin:8px 0}
              .modal p{color:#475569;margin-bottom:16px;line-height:1.5}
              .modal label{font-size:13px;font-weight:600;color:#374151;display:block;margin-top:12px}
              .modal input{width:100%;padding:10px 14px;border:1px solid #d1d5db;border-radius:8px;font-size:15px;margin-top:4px;font-family:inherit}
              .modal input:focus{outline:2px solid #2563eb;outline-offset:2px;border-color:transparent}
              .modal .btn-p{width:100%;padding:13px;margin-top:18px;font-size:16px}
              .modal .btn-s{padding:8px 20px;border:1px solid #d1d5db;border-radius:6px;background:#fff;cursor:pointer;font-size:14px;margin-top:12px;display:inline-block}
              .modal .btn-s:hover{background:#f9fafb}
              .suc{text-align:center;padding:20px 0}
              .suc .ico{font-size:56px;margin-bottom:12px}
              .suc h2{color:#065f46}
              .suc p{font-size:16px;color:#475569;margin-bottom:12px}
              .sp{display:inline-block;width:16px;height:16px;border:2px solid #e2e8f0;border-top-color:#2563eb;border-radius:50%;animation:sp .6s linear infinite}
              @keyframes sp{to{transform:rotate(360deg)}}
              .st{text-align:center;padding:14px;border-radius:8px;margin-bottom:16px;font-size:14px}
              .st-e{background:#fef2f2;color:#991b1b;border:1px solid #fecaca}
              .st-s{background:#f0fdf4;color:#166534;border:1px solid #bbf7d0}
              </style></head><body>
              <header><div class="w hdr">
                <div class="logo">
                  <svg viewBox="0 0 90 28" xmlns="http://www.w3.org/2000/svg"><text x="0" y="22" font-family="Inter,Arial,Helvetica,sans-serif" font-size="22" font-weight="800" letter-spacing=".01em" fill="#0f172a">Sorny</text><rect x="80" y="0" width="3" height="22" rx="1" fill="#2563eb"/></svg>
                </div>
                <div class="nav"><span>Televisores</span><span>Audio</span><span>Soporte</span></div>
              </div></header>
              <section class="hero"><div class="w"><h1>Televisores Sorny</h1><p>Imagen clara, sonido envolvente y pantallas para disfrutar películas, deportes y videojuegos en casa.</p><a class="btn btn-p" href="#tienda">Ver modelos</a></div></section>
              <section class="sec w" id="tienda"><h2>Modelos destacados</h2><p class="muted">Elegí por tamaño, resolución y experiencia de uso.</p><div class="grid" id="gr"></div></section>
              <div id="res" class="st w" style="display:none"></div>
              <div id="ov" class="overlay"><div class="modal" id="md"></div></div>
              <script>
              const S={"sorni-luma-32":"32 LED","sorni-braviax-43":"43 Smart","sorni-croma-50":"50 4K","sorni-trinitronix-55":"55 4K","sorni-cinepro-65":"65 4K","sorni-mega-75":"75 Cine"};
              async function load(){const r=await fetch("/api/products"),d=await r.json(),g=document.getElementById("gr");g.innerHTML="";d.items.forEach((i,n)=>{const c=document.createElement("div");c.className="card";c.innerHTML='<div class="tvvis"><span class="sz">'+S[i.sku]+'</span><div class="tvs t'+((n%6)+1)+'"></div></div><div class="body"><div class="sk">'+i.sku.replace("sorni-","").replaceAll("-"," ")+'</div><h3>'+i.name+'</h3><div class="desc">'+i.description+'</div><div class="prc">$'+i.price.toLocaleString("es-AR")+'</div><button class="btn btn-p" data-sk="'+i.sku+'" data-nm="'+i.name+'" data-pr="'+i.price+'">Comprar ahora</button></div>';g.appendChild(c)});g.querySelectorAll("button").forEach(b=>b.onclick=()=>buy(b.dataset.sk,b.dataset.nm,b.dataset.pr))}
              function show(v){v?document.getElementById("ov").classList.add("s"):document.getElementById("ov").classList.remove("s")}
              function msg(t,c){const r=document.getElementById("res");r.textContent=t;r.className="st w "+(c||"st-e");r.style.display="block";setTimeout(()=>{r.style.display="none"},8e3)}
              function fm(p,m,pay){document.getElementById("md").innerHTML='<h2>Pago y envío</h2><p style="margin-bottom:16px"><strong>'+m+'</strong></p><div class="prc">$'+Number(p).toLocaleString("es-AR")+'</div><div style="background:#eff6ff;border:1px solid #bfdbfe;border-radius:10px;padding:14px;margin:14px 0"><strong>Pago seguro</strong><p style="margin:6px 0 0;color:#475569">Referencia de pago: '+(window._pid||"-")+'</p><a href="'+(pay||"#")+'" target="_blank" style="display:inline-block;margin-top:8px;color:#2563eb;font-weight:600">Ver detalle de pago</a></div><label>Número de tarjeta</label><input id="pc" inputmode="numeric" placeholder="4111 1111 1111 1111"><label>Vencimiento</label><input id="ex" placeholder="MM/AA"><label>CVV</label><input id="cv" inputmode="numeric" placeholder="123"><label>Nombre completo</label><input id="fn"><label>Email</label><input id="em" type="email"><label>Teléfono</label><input id="ph" type="tel"><label>Dirección de envío</label><input id="ad"><button class="btn btn-p" id="cf">Pagar y coordinar envío</button><button class="btn-s" onclick="show(false)">Cancelar</button>';show(true);document.getElementById("cf").onclick=cf}
              async function cf(){const b=document.getElementById("cf");b.disabled=true;b.textContent="Confirmando pago...";try{const r=await fetch("/api/delivery",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:document.getElementById("fn").value,email:document.getElementById("em").value,phone:document.getElementById("ph").value,address:document.getElementById("ad").value,purchase_id:window._pid,product_name:window._pnm})}),d=await r.json();if(!r.ok){msg("Error al procesar: "+(d.error||"intentá nuevamente"));b.disabled=false;b.textContent="Pagar y coordinar envío";return}show(false);document.getElementById("md").innerHTML='<div class="suc"><div class="ico">✅</div><h2>¡Pago aprobado!</h2><p>Compra procesada. Te vamos a contactar a <strong>'+(document.getElementById("em").value||"tu email")+'</strong> para coordinar el envío de tu <strong>'+window._pnm+'</strong>.</p><p>Referencia: '+window._pid+'</p><button class="btn btn-p" onclick="location.reload()">Volver a la tienda</button></div>';show(true)}catch(e){msg("Error de conexión: intentá nuevamente");b.disabled=false;b.textContent="Pagar y coordinar envío"}}
              async function buy(s,n,p){const r=document.getElementById("res");r.style.display="none";document.getElementById("md").innerHTML='<div style="text-align:center;padding:30px"><div class="sp"></div><p style="margin-top:16px;color:#64748b">Preparando pago...</p></div>';show(true);try{const q=await fetch("/api/purchases",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({sku:s,customer:"cliente@sorny.local"})}),d=await q.json();if(!q.ok){show(false);msg("No pudimos completar la compra: "+(d.error||"intentá nuevamente"));return}window._pid=d.purchase_id;window._pnm=n;window._pay=d.payment_url;fm(p,n,d.payment_url)}catch(e){show(false);msg("Error de conexión al servidor")}}
              load();
              </script></body></html>""", mimetype="text/html")
          @app.get("/checkout")
          def checkout():
              pid=request.args.get("pid","")
              amount=request.args.get("amount","")
              amount_label = "$" + amount
              return Response(f"""<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pago Sorny</title><style>body{{margin:0;background:#f4f6fa;color:#0f172a;font-family:Inter,system-ui,Segoe UI,Arial,sans-serif}}.box{{max-width:520px;margin:48px auto;background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:32px;box-shadow:0 12px 30px rgba(15,23,42,.08)}}h1{{margin:0 0 12px;font-size:28px}}p{{color:#475569;line-height:1.5}}.amt{{font-size:30px;font-weight:800;margin:18px 0}}.ref{{background:#eff6ff;border:1px solid #bfdbfe;border-radius:10px;padding:14px;margin:18px 0}}label{{font-size:13px;font-weight:600;color:#374151;display:block;margin-top:12px}}input{{width:100%;padding:10px 14px;border:1px solid #d1d5db;border-radius:8px;font-size:15px;margin-top:4px;box-sizing:border-box}}button{{width:100%;border:0;border-radius:8px;background:#2563eb;color:#fff;padding:13px;margin-top:18px;font-weight:700;font-size:16px;cursor:pointer}}</style></head><body><main class="box"><h1>Pago seguro Sorny</h1><p>Completá los datos para confirmar tu compra.</p><div class="amt">{amount_label}</div><div class="ref">Referencia: <strong>{pid}</strong></div><label>Número de tarjeta</label><input placeholder="4111 1111 1111 1111"><label>Vencimiento</label><input placeholder="MM/AA"><label>CVV</label><input placeholder="123"><button onclick="this.textContent='Pago aprobado';this.style.background='#16a34a'">Pagar ahora</button></main></body></html>""", mimetype="text/html")
          @app.get("/health")
          def h(): return {"service":"frontend","status":"ok"}
          PYAPP
          cat > /opt/aws/amazon-cloudwatch-agent/etc/amazon-cloudwatch-agent.json << 'CWCONFIG'
          {"logs":{"logs_collected":{"files":{"collect_list":[{"file_path":"/var/log/sorni/frontend.log","log_group_name":"/${ProjectName}/${Environment}/site","log_stream_name":"frontend"}]}}}}
          CWCONFIG
          cat > /etc/systemd/system/sorni-frontend.service << 'SRV'
          [Unit]
          Description=Sorny frontend
          After=network-online.target
          Wants=network-online.target

          [Service]
          WorkingDirectory=/opt/sorni/frontend
          ExecStart=/usr/local/bin/gunicorn --bind 0.0.0.0:5000 --workers 2 app:app
          Restart=always
          RestartSec=3
          StandardOutput=append:/var/log/sorni/frontend.log
          StandardError=append:/var/log/sorni/frontend.log

          [Install]
          WantedBy=multi-user.target
          SRV
          systemctl daemon-reload && systemctl enable sorni-frontend && systemctl start sorni-frontend
          /opt/aws/amazon-cloudwatch-agent/bin/amazon-cloudwatch-agent-ctl -a fetch-config -m ec2 -c file:/opt/aws/amazon-cloudwatch-agent/etc/amazon-cloudwatch-agent.json -s
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-frontend-${Environment}
        - Key: Lab
          Value: m2-c3-sorny-microservices

  # ── EC2: MONOLITH ─────────────────────────────────────────────────────────────
  MonolithNode:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref SsmInstanceProfileName
      NetworkInterfaces:
        - DeviceIndex: 0
          AssociatePublicIpAddress: true
          SubnetId: !Ref SubnetAId
          GroupSet: [!Ref MonolithSg]
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euo pipefail
          exec > >(tee /var/log/user-data.log) 2>&1
          dnf update -y && dnf install -y python3 python3-pip amazon-cloudwatch-agent
          pip3 install flask gunicorn
          mkdir -p /opt/sorni/monolith /var/log/sorni
          cat > /opt/sorni/monolith/app.py << 'PYAPP'
          import uuid
          from flask import Flask, jsonify, request
          app = Flask(__name__)
          PRODUCTS=[{"sku":"sorni-luma-32","name":"Sorny Luma 32","description":"LED 32 pulgadas para habitacion o cocina","price":189999},{"sku":"sorni-braviax-43","name":"Sorny Braviax 43","description":"Smart TV 43 pulgadas Full HD","price":319999},{"sku":"sorni-croma-50","name":"Sorny Croma 50","description":"4K 50 pulgadas con HDR basico","price":489999},{"sku":"sorni-trinitronix-55","name":"Sorny Trinitronix 55","description":"4K 55 pulgadas, panel rapido para deportes","price":629999},{"sku":"sorni-cinepro-65","name":"Sorny CinePro 65","description":"4K 65 pulgadas para living grande","price":899999},{"sku":"sorni-mega-75","name":"Sorny Mega 75","description":"75 pulgadas, experiencia cine en casa","price":1299999}]
          INVENTORY={i["sku"]:3 for i in PRODUCTS}
          PURCHASES={}
          def fp(s): return next((i for i in PRODUCTS if i["sku"]==s),None)
          @app.get("/api/health")
          def h(): return jsonify({"service":"monolithic-backend","status":"ok"})
          @app.get("/api/products")
          def products(): return jsonify({"backend":"monolithic-backend","items":PRODUCTS})
          @app.post("/api/purchases")
          def create():
              p=request.get_json(silent=True) or {}; s=p.get("sku"); pr=fp(s)
              if not pr: return jsonify({"error":"unknown_sku"}),404
              if INVENTORY.get(s,0)<=0: return jsonify({"error":"out_of_inventory"}),409
              INVENTORY[s]-=1; pid="pur-"+uuid.uuid4().hex[:8]; purl="/checkout?pid="+pid+"&amount="+str(pr["price"])
              PURCHASES[pid]={"purchase_id":pid,"sku":s,"status":"payment_pending","payment_url":purl}
              app.logger.info("monolith purchase created pid=%s sku=%s",pid,s)
              return jsonify({"backend":"monolithic-backend","purchase_id":pid,"sku":s,"status":"payment_pending","payment_url":purl})
          @app.get("/api/purchases/<pid>")
          def get(pid):
              pu=PURCHASES.get(pid)
              if not pu: return jsonify({"error":"not_found"}),404
              return jsonify(pu)
          @app.post("/api/delivery")
          def delivery():
              p=request.get_json(silent=True) or {}
              app.logger.info("delivery request name=%s email=%s product=%s",p.get("name"),p.get("email"),p.get("product_name"))
              return jsonify({"status":"delivery_pending","message":"Te contactaremos para coordinar el envio","backend":"monolithic-backend"})
          PYAPP
          cat > /opt/aws/amazon-cloudwatch-agent/etc/amazon-cloudwatch-agent.json << 'CWCONFIG'
          {"logs":{"logs_collected":{"files":{"collect_list":[
            {"file_path":"/var/log/sorni/monolith.log","log_group_name":"/${ProjectName}/${Environment}/site","log_stream_name":"monolithic-backend"}
          ]}}}}
          CWCONFIG
          cat > /etc/systemd/system/sorni-monolith.service << 'SRV'
          [Unit]
          Description=Sorny monolith
          After=network-online.target
          Wants=network-online.target

          [Service]
          WorkingDirectory=/opt/sorni/monolith
          ExecStart=/usr/local/bin/gunicorn --bind 0.0.0.0:5001 --workers 2 app:app
          Restart=always
          RestartSec=3
          StandardOutput=append:/var/log/sorni/monolith.log
          StandardError=append:/var/log/sorni/monolith.log

          [Install]
          WantedBy=multi-user.target
          SRV
          systemctl daemon-reload && systemctl enable sorni-monolith && systemctl start sorni-monolith
          /opt/aws/amazon-cloudwatch-agent/bin/amazon-cloudwatch-agent-ctl -a fetch-config -m ec2 -c file:/opt/aws/amazon-cloudwatch-agent/etc/amazon-cloudwatch-agent.json -s
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-monolith-${Environment}
        - Key: Lab
          Value: m2-c3-sorny-microservices

