AWSTemplateFormatVersion: '2010-09-09'
Description: 'CloudCuyo - Bootstrap: NAT Instance + IAM Roles'

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: "Configuración de Red"
        Parameters:
          - VpcId
          - PublicSubnetId
          - PrivateRouteTableId
      - Label:
          default: "Configuración de Instancia"
        Parameters:
          - InstanceType
          - KeyPairName
      - Label:
          default: "Etiquetas"
        Parameters:
          - ProjectName
          - Environment

    ParameterLabels:
      VpcId:
        default: "VPC ID"
      PublicSubnetId:
        default: "Subnet Pública"
      PrivateRouteTableId:
        default: "Route Table Privada"
      InstanceType:
        default: "Tipo de Instancia"
      KeyPairName:
        default: "Key Pair"
      ProjectName:
        default: "Nombre del Proyecto"
      Environment:
        default: "Ambiente"

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: ID de la VPC donde se desplegará la NAT instance

  PublicSubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: ID de la subnet pública donde se ubicará la NAT instance

  PrivateRouteTableId:
    Type: String
    Description: ID de la Route Table privada que apuntará a esta NAT instance
    AllowedPattern: "^rtb-[a-z0-9]+$"

  InstanceType:
    Type: String
    Default: t3.micro
    AllowedValues:
      - t3.micro
      - t3.small
      - t3.medium
    Description: Tipo de instancia EC2 (t3.micro es suficiente para lab, ~$7/mes)

  KeyPairName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: Key pair para acceso SSH a la NAT instance (para troubleshooting)

  ProjectName:
    Type: String
    Default: cloudcuyo
    Description: Nombre del proyecto (usado en tags)
    AllowedPattern: "^[a-z0-9-]+$"

  Environment:
    Type: String
    Default: lab
    AllowedValues:
      - dev
      - lab
      - staging
      - prod
    Description: Ambiente de despliegue

Mappings:
  # AMI IDs de Amazon Linux 2023 (SSM Agent preinstalado)
  RegionMap:
    us-east-1:
      AMI: ami-0230bd60aa48260c6  # Amazon Linux 2023
    us-east-2:
      AMI: ami-0a606d8395a538502
    us-west-1:
      AMI: ami-0d9858aa3c6322f73
    us-west-2:
      AMI: ami-098e42ae54c764c35
    sa-east-1:
      AMI: ami-0c3b6e2e1c9b8c96d

Resources:
  # Security Group para NAT Instance
  NATSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub '${ProjectName}-nat-sg-${Environment}'
      GroupDescription: Security group para NAT instance - permite trafico desde subnets privadas
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: -1
          CidrIp: 10.0.0.0/16
          Description: Todo el trafico desde VPC
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
          Description: Todo el trafico hacia Internet
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-nat-sg-${Environment}'
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  # ============================================================================
  # IAM Roles
  # ============================================================================

  # IAM Role para VM Import (usado por aws ec2 import-image)
  VMImportRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: vmimport
      Description: Role para importar VMs como AMIs en EC2
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: vmie.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                sts:Externalid: vmimport
      Policies:
        - PolicyName: vmimport-policy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetBucketLocation
                  - s3:GetObject
                  - s3:ListBucket
                Resource:
                  - !Sub 'arn:aws:s3:::*'
                  - !Sub 'arn:aws:s3:::*/*'
              - Effect: Allow
                Action:
                  - ec2:ModifySnapshotAttribute
                  - ec2:CopySnapshot
                  - ec2:RegisterImage
                  - ec2:Describe*
                Resource: '*'
      Tags:
        - Key: Name
          Value: vmimport
        - Key: Project
          Value: !Ref ProjectName

  # IAM Role SSM (para SSM Session Manager en todas las EC2)
  SSMInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-SSM-instance-role-${Environment}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
        - arn:aws:iam::aws:policy/CloudWatchAgentServerPolicy
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-SSM-instance-role-${Environment}'
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  # Instance Profile para asociar el Role a la EC2
  NATInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub '${ProjectName}-nat-instance-profile-${Environment}'
      Roles:
        - !Ref SSMInstanceRole

  # Elastic IP para la NAT Instance
  NATElasticIP:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-nat-eip-${Environment}'
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  # NAT Instance EC2
  NATInstance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: !FindInMap [RegionMap, !Ref 'AWS::Region', AMI]
      KeyName: !Ref KeyPairName
      IamInstanceProfile: !Ref NATInstanceProfile
      NetworkInterfaces:
        - DeviceIndex: 0
          AssociatePublicIpAddress: true
          SubnetId: !Ref PublicSubnetId
          GroupSet:
            - !Ref NATSecurityGroup
      # Deshabilitar Source/Destination Check (CRÍTICO para NAT)
      SourceDestCheck: false
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -e

          # Log de inicio
          exec > >(tee /var/log/user-data.log)
          exec 2>&1
          echo "=== Configurando NAT Instance ==="
          date

          # Actualizar paquetes (Amazon Linux 2023 usa dnf)
          dnf update -y

          # Instalar herramientas útiles
          dnf install -y tcpdump iptables-services

          # Habilitar IP forwarding (CRÍTICO para NAT)
          echo "net.ipv4.ip_forward = 1" >> /etc/sysctl.conf
          sysctl -p

          # Detectar interfaz de salida. En Amazon Linux 2023 suele ser ens5, no eth0.
          NAT_INTERFACE=$(ip route show default | awk '{print $5; exit}')
          echo "Interfaz NAT detectada: $NAT_INTERFACE"

          # Configurar iptables para NAT
          # Regla de MASQUERADE para traducir IPs privadas a la IP pública
          iptables -t nat -A POSTROUTING -o $NAT_INTERFACE -j MASQUERADE
          iptables -A FORWARD -i $NAT_INTERFACE -o $NAT_INTERFACE -m state --state RELATED,ESTABLISHED -j ACCEPT
          iptables -A FORWARD -i $NAT_INTERFACE -o $NAT_INTERFACE -j ACCEPT

          # Guardar reglas de iptables
          iptables-save > /etc/sysconfig/iptables
          systemctl enable iptables
          systemctl start iptables

          # SSM Agent ya viene preinstalado en Amazon Linux 2023
          systemctl status amazon-ssm-agent
          systemctl enable amazon-ssm-agent

          # Instalar CloudWatch Agent
          wget https://s3.amazonaws.com/amazoncloudwatch-agent/amazon_linux/amd64/latest/amazon-cloudwatch-agent.rpm
          rpm -U ./amazon-cloudwatch-agent.rpm

          # Configurar CloudWatch Agent para monitoreo básico
          cat > /opt/aws/amazon-cloudwatch-agent/etc/config.json <<'EOF'
          {
            "metrics": {
              "namespace": "CloudCuyo/NAT",
              "metrics_collected": {
                "cpu": {
                  "measurement": [
                    {"name": "cpu_usage_idle", "rename": "CPU_IDLE", "unit": "Percent"},
                    {"name": "cpu_usage_iowait", "rename": "CPU_IOWAIT", "unit": "Percent"}
                  ],
                  "totalcpu": false
                },
                "disk": {
                  "measurement": [
                    {"name": "used_percent", "rename": "DISK_USED", "unit": "Percent"}
                  ],
                  "resources": ["*"]
                },
                "mem": {
                  "measurement": [
                    {"name": "mem_used_percent", "rename": "MEM_USED", "unit": "Percent"}
                  ]
                },
                "net": {
                  "measurement": [
                    {"name": "bytes_sent", "rename": "NET_OUT", "unit": "Bytes"},
                    {"name": "bytes_recv", "rename": "NET_IN", "unit": "Bytes"}
                  ],
                  "resources": ["*"]
                }
              }
            }
          }
          EOF

          /opt/aws/amazon-cloudwatch-agent/bin/amazon-cloudwatch-agent-ctl \
            -a fetch-config \
            -m ec2 \
            -s \
            -c file:/opt/aws/amazon-cloudwatch-agent/etc/config.json

          # Crear script de health check
          cat > /usr/local/bin/nat-health-check.sh <<'SCRIPT'
          #!/bin/bash
          # Health check para NAT instance

          # Verificar IP forwarding
          if [ "$(cat /proc/sys/net/ipv4/ip_forward)" != "1" ]; then
            echo "ERROR: IP forwarding deshabilitado"
            exit 1
          fi

          NAT_INTERFACE=$(ip route show default | awk '{print $5; exit}')

          # Verificar reglas de iptables
          if ! iptables -t nat -S POSTROUTING | grep -q -- "-o $NAT_INTERFACE -j MASQUERADE"; then
            echo "ERROR: Regla de MASQUERADE no encontrada para $NAT_INTERFACE"
            exit 1
          fi

          # Verificar conectividad a Internet
          if ! ping -c 1 8.8.8.8 > /dev/null 2>&1; then
            echo "ERROR: Sin conectividad a Internet"
            exit 1
          fi

          echo "OK: NAT instance funcionando correctamente"
          exit 0
          SCRIPT

          chmod +x /usr/local/bin/nat-health-check.sh

          # Ejecutar health check inicial
          /usr/local/bin/nat-health-check.sh

          # Configurar cron para health check cada 5 minutos
          echo "*/5 * * * * /usr/local/bin/nat-health-check.sh >> /var/log/nat-health.log 2>&1" | crontab -

          echo "=== Configuración de NAT Instance completada ==="
          date
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-nat-instance-${Environment}'
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: Role
          Value: NAT

  # Asociar Elastic IP a la NAT Instance
  NATEIPAssociation:
    Type: AWS::EC2::EIPAssociation
    Properties:
      InstanceId: !Ref NATInstance
      EIP: !Ref NATElasticIP

  # Ruta en la Route Table privada hacia la NAT Instance
  PrivateRouteToNAT:
    Type: AWS::EC2::Route
    DependsOn: NATInstance
    Properties:
      RouteTableId: !Ref PrivateRouteTableId
      DestinationCidrBlock: 0.0.0.0/0
      InstanceId: !Ref NATInstance


Outputs:
  VMImportRoleName:
    Description: Nombre del rol IAM para VM Import (debe llamarse vmimport)
    Value: !Ref VMImportRole
    Export:
      Name: !Sub '${ProjectName}-vmimport-role-${Environment}'

  NATInstanceId:
    Description: ID de la NAT Instance
    Value: !Ref NATInstance
    Export:
      Name: !Sub '${ProjectName}-nat-instance-id-${Environment}'

  NATInstancePrivateIP:
    Description: IP privada de la NAT Instance
    Value: !GetAtt NATInstance.PrivateIp
    Export:
      Name: !Sub '${ProjectName}-nat-instance-private-ip-${Environment}'

  NATInstancePublicIP:
    Description: IP pública de la NAT Instance (Elastic IP)
    Value: !Ref NATElasticIP
    Export:
      Name: !Sub '${ProjectName}-nat-instance-public-ip-${Environment}'

  NATSecurityGroupId:
    Description: ID del Security Group de la NAT Instance
    Value: !Ref NATSecurityGroup
    Export:
      Name: !Sub '${ProjectName}-nat-sg-id-${Environment}'

  SSMInstanceProfileName:
    Description: Nombre del Instance Profile para SSM (usar en TODAS las instancias EC2)
    Value: !Ref NATInstanceProfile
    Export:
      Name: !Sub '${ProjectName}-ssm-instance-profile-${Environment}'

  SSMInstanceProfileArn:
    Description: ARN del Instance Profile
    Value: !GetAtt NATInstanceProfile.Arn
    Export:
      Name: !Sub '${ProjectName}-ssm-instance-profile-arn-${Environment}'

  SSMSessionCommand:
    Description: Comando para conectar via SSM Session Manager
    Value: !Sub |
      # Bash
      aws ssm start-session --target ${NATInstance}

      # PowerShell
      Start-SSMSession -Target ${NATInstance}
