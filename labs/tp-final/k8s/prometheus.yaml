apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: tp-final-ej3
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
      evaluation_interval: 5s
    rule_files:
      - /etc/prometheus/rules/alerts.yml
    scrape_configs:
      - job_name: pagos-api
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [tp-final-ej3]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: keep
            regex: pagos-api
          - source_labels: [__meta_kubernetes_pod_ready]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_pod_container_port_number]
            action: keep
            regex: "8000"
          - source_labels: [__meta_kubernetes_pod_ip, __meta_kubernetes_pod_container_port_number]
            separator: ":"
            regex: (.+):(.+)
            target_label: __address__
            replacement: $1:$2
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
  alerts.yml: |
    groups:
      - name: pago-api-saturacion
        rules:
          - alert: PagoApiCercaDeSaturacion
            expr: max by (pod) (payment_requests_in_flight{namespace="tp-final-ej3"}) >= 7
            for: 15s
            labels:
              severity: warning
            annotations:
              summary: "Un pod de pagos tiene 7 o más solicitudes en curso"
              description: "El proceso de demo dispone de 10 threads; revisar dependencia, latencia y errores antes de ocupar el pool."
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: tp-final-ej3
  labels:
    app: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v2.55.1
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=1h
            - --web.enable-lifecycle
          ports:
            - name: http
              containerPort: 9090
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
              readOnly: true
            - name: config
              mountPath: /etc/prometheus/rules/alerts.yml
              subPath: alerts.yml
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: tp-final-ej3
spec:
  selector:
    app: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: http
