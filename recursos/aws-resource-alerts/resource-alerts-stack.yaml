AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Automatizacion educativa para detectar recursos AWS activos y avisar por email.
  No elimina recursos ni reemplaza Cost Explorer.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Notificacion
        Parameters:
          - NotificationEmail
    ParameterLabels:
      NotificationEmail:
        default: Email para recibir avisos

Parameters:
  NotificationEmail:
    Type: String
    Description: Direccion que recibira los avisos diarios. Debe confirmar la suscripcion SNS.
    AllowedPattern: '^[^\s@]+@[^\s@]+\.[^\s@]+$'
    ConstraintDescription: Ingresá una direccion de email valida.

Resources:
  ResourceAlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      DisplayName: AWS resource alerts
      TopicName: !Sub resource-alerts-${AWS::AccountId}-${AWS::Region}
      Tags:
        - Key: ManagedBy
          Value: cloudformation
        - Key: Purpose
          Value: resource-alerts

  ResourceAlertSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref ResourceAlertTopic
      Protocol: email
      Endpoint: !Ref NotificationEmail

  ResourceInventoryFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub resource-alerts-role-${AWS::AccountId}-${AWS::Region}
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: resource-inventory-read-only
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: WriteLambdaLogs
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: '*'
              - Sid: PublishResourceAlerts
                Effect: Allow
                Action: sns:Publish
                Resource: !Ref ResourceAlertTopic
              - Sid: ReadResourceInventory
                Effect: Allow
                Action:
                  - ec2:DescribeAddresses
                  - ec2:DescribeInstances
                  - ec2:DescribeNatGateways
                  - ec2:DescribeSnapshots
                  - ec2:DescribeVolumes
                  - ecr:DescribeRepositories
                  - elasticloadbalancing:DescribeLoadBalancers
                  - lambda:ListFunctions
                  - rds:DescribeDBClusters
                  - rds:DescribeDBInstances
                  - s3:ListAllMyBuckets
                  - dynamodb:ListTables
                Resource: '*'
      Tags:
        - Key: ManagedBy
          Value: cloudformation
        - Key: Purpose
          Value: resource-alerts

  ResourceInventoryFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub resource-alerts-${AWS::AccountId}-${AWS::Region}
      Description: Inventario diario de recursos potencialmente facturables.
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt ResourceInventoryFunctionRole.Arn
      Timeout: 60
      MemorySize: 256
      Environment:
        Variables:
          ALERT_TOPIC_ARN: !Ref ResourceAlertTopic
          AWS_REGION_NAME: !Ref AWS::Region
      Tags:
        - Key: ManagedBy
          Value: cloudformation
        - Key: Purpose
          Value: resource-alerts
      Code:
        ZipFile: |
          import os
          from datetime import datetime, timezone

          import boto3

          REGION = os.environ.get("AWS_REGION_NAME", os.environ.get("AWS_REGION", "unknown"))
          TOPIC_ARN = os.environ["ALERT_TOPIC_ARN"]
          sns = boto3.client("sns")

          def pages(client, operation, result_key, **kwargs):
              paginator = client.get_paginator(operation)
              for page in paginator.paginate(**kwargs):
                  for item in page.get(result_key, []):
                      yield item

          def inventory():
              resources = []

              ec2 = boto3.client("ec2", region_name=REGION)
              for item in pages(ec2, "describe_instances", "Reservations"):
                  for instance in item.get("Instances", []):
                      if instance.get("State", {}).get("Name") in {"pending", "running", "stopping", "stopped"}:
                          resources.append(("EC2 instance", instance.get("InstanceId", "unknown"), instance.get("State", {}).get("Name")))
              for volume in pages(ec2, "describe_volumes", "Volumes"):
                  resources.append(("EBS volume", volume.get("VolumeId", "unknown"), volume.get("State", "unknown")))
              for snapshot in pages(ec2, "describe_snapshots", "Snapshots", OwnerIds=["self"]):
                  resources.append(("EBS snapshot", snapshot.get("SnapshotId", "unknown"), "stored"))
              for nat in pages(ec2, "describe_nat_gateways", "NatGateways", Filter=[{"Name": "state", "Values": ["pending", "available", "deleting"]}]):
                  resources.append(("NAT gateway", nat.get("NatGatewayId", "unknown"), nat.get("State", "unknown")))
              for address in ec2.describe_addresses().get("Addresses", []):
                  resources.append(("Elastic IP", address.get("AllocationId", address.get("PublicIp", "unknown")), "allocated"))

              rds = boto3.client("rds", region_name=REGION)
              for db in pages(rds, "describe_db_instances", "DBInstances"):
                  resources.append(("RDS instance", db.get("DBInstanceArn", db.get("DBInstanceIdentifier", "unknown")), db.get("DBInstanceStatus", "unknown")))
              for cluster in pages(rds, "describe_db_clusters", "DBClusters"):
                  resources.append(("RDS cluster", cluster.get("DBClusterArn", cluster.get("DBClusterIdentifier", "unknown")), cluster.get("Status", "unknown")))

              elbv2 = boto3.client("elbv2", region_name=REGION)
              for lb in pages(elbv2, "describe_load_balancers", "LoadBalancers"):
                  resources.append(("Load balancer", lb.get("LoadBalancerArn", "unknown"), lb.get("State", {}).get("Code", "unknown")))

              lamb = boto3.client("lambda", region_name=REGION)
              for function in pages(lamb, "list_functions", "Functions"):
                  resources.append(("Lambda function", function.get("FunctionArn", "unknown"), "deployed"))

              dynamodb = boto3.client("dynamodb", region_name=REGION)
              for table_name in pages(dynamodb, "list_tables", "TableNames"):
                  resources.append(("DynamoDB table", table_name, "exists"))

              s3 = boto3.client("s3", region_name=REGION)
              for bucket in s3.list_buckets().get("Buckets", []):
                  resources.append(("S3 bucket", bucket.get("Name", "unknown"), "exists"))

              ecr = boto3.client("ecr", region_name=REGION)
              for repository in pages(ecr, "describe_repositories", "repositories"):
                  resources.append(("ECR repository", repository.get("repositoryArn", "unknown"), "exists"))

              return resources

          def handler(event, context):
              now = datetime.now(timezone.utc).isoformat()
              resources = inventory()
              print({"region": REGION, "resource_count": len(resources), "checked_at": now})

              if not resources:
                  return {"alert_sent": False, "resource_count": 0}

              lines = [
                  "Se detectaron recursos AWS activos o almacenados para revisar.",
                  "",
                  f"Region revisada: {REGION}",
                  f"Momento UTC: {now}",
                  f"Cantidad detectada: {len(resources)}",
                  "",
              ]
              for resource_type, identifier, state in sorted(resources):
                  lines.append(f"- {resource_type} | {state} | {identifier}")
              lines.extend([
                  "",
                  "Este aviso es un inventario de recursos existentes; no es una medicion de costo en tiempo real.",
                  "Revisá Cost Explorer y la consola del servicio antes de eliminar algo.",
                  "La automatizacion nunca elimina recursos.",
              ])
              sns.publish(
                  TopicArn=TOPIC_ARN,
                  Subject=f"AWS resource alert - {REGION} - {len(resources)} recurso(s)",
                  Message="\n".join(lines),
              )
              return {"alert_sent": True, "resource_count": len(resources)}

  DailyResourceInventoryRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub resource-alerts-daily-${AWS::AccountId}-${AWS::Region}
      Description: Ejecuta el inventario de recursos una vez por dia.
      ScheduleExpression: rate(1 day)
      State: ENABLED
      Targets:
        - Arn: !GetAtt ResourceInventoryFunction.Arn
          Id: DailyResourceInventoryTarget

  DailyResourceInventoryPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ResourceInventoryFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt DailyResourceInventoryRule.Arn

Outputs:
  NotificationTopicArn:
    Description: ARN del topic SNS usado para enviar avisos.
    Value: !Ref ResourceAlertTopic
  InventoryFunctionName:
    Description: Nombre de la Lambda que revisa los recursos.
    Value: !Ref ResourceInventoryFunction
  DailyRuleName:
    Description: Regla EventBridge que ejecuta la revision diaria.
    Value: !Ref DailyResourceInventoryRule
  EmailConfirmationRequired:
    Description: La suscripcion SNS debe confirmarse desde el email recibido.
    Value: Confirmá la suscripcion SNS desde el correo recibido.
